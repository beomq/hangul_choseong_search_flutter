name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Dart ${{ matrix.dart-sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dart-sdk:
          - '3.5.3'
          - stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1.8.0
        with:
          sdk: ${{ matrix.dart-sdk }}
      - name: Resolve dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze
      - name: Test
        run: dart test

  release-smoke:
    name: Stable release smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up stable Dart
        uses: dart-lang/setup-dart@v1.8.0
        with:
          sdk: stable
      - name: Resolve dependencies
        run: dart pub get
      - name: Generate API documentation
        run: dart doc
      - name: Run every example
        shell: bash
        run: |
          set -euo pipefail
          for example in example/*.dart; do
            dart run "$example"
          done
      - name: Run benchmark smoke test
        run: dart run benchmark/search_benchmark.dart
      - name: Validate and inspect package archive
        run: dart pub publish --dry-run

  lower-bound:
    name: Dart 3.5.3 with downgraded dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Dart 3.5.3
        uses: dart-lang/setup-dart@v1.8.0
        with:
          sdk: '3.5.3'
      - name: Resolve dependencies
        run: dart pub get
      - name: Resolve lowest allowed direct dependencies
        run: dart pub downgrade benchmark_harness lints test
      - name: Analyze
        run: dart analyze
      - name: Test
        run: dart test
